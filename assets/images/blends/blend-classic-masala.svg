<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 480" width="100%" height="100%">
  <defs>
    <linearGradient id="blendGrad_ClassicMasala" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E3326"/>
      <stop offset="25%" stop-color="#144634"/>
      <stop offset="75%" stop-color="#144634"/>
      <stop offset="100%" stop-color="#0A261C"/>
    </linearGradient>
    <filter id="blendShadow_ClassicMasala" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0a1d15" flood-opacity="0.25"/>
    </filter>
    <clipPath id="blendClip_ClassicMasala">
      <path d="M 45,35 L 295,35 Q 310,35 308,50 L 298,425 Q 295,445 270,448 L 70,448 Q 45,445 42,425 L 32,50 Q 30,35 45,35 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#blendShadow_ClassicMasala)">
    <!-- Pouch Body -->
    <path d="M 45,35 L 295,35 Q 310,35 308,50 L 298,425 Q 295,445 270,448 L 70,448 Q 45,445 42,425 L 32,50 Q 30,35 45,35 Z" fill="url(#blendGrad_ClassicMasala)"/>

    <g clip-path="url(#blendClip_ClassicMasala)">
      <!-- Seal & Ziplock lines -->
      <line x1="25" y1="42" x2="315" y2="42" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
      <line x1="25" y1="68" x2="315" y2="68" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
      <line x1="25" y1="72" x2="315" y2="72" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>

      <!-- Notches -->
      <path d="M 33,78 L 39,81 L 33,84 Z" fill="rgba(0,0,0,0.3)"/>
      <path d="M 307,78 L 301,81 L 307,84 Z" fill="rgba(0,0,0,0.3)"/>

      <!-- Brand Logo Leaf -->
      <g transform="translate(170, 130)">
        <path d="M 0,-14 C 10,-14 16,-4 14,10 C 8,10 -2,4 0,-14 Z" fill="#F4F7F2" opacity="0.85"/>
        <path d="M 0,-14 C -2,-14 -8,0 -6,8 C -2,8 5,2 0,-14 Z" fill="#82A391"/>
        <path d="M 0,-12 L 2,10" stroke="#144634" stroke-width="1"/>
      </g>

      <!-- Brand Tag -->
      <text x="170" y="160" font-family="'Manrope', sans-serif" font-weight="700" font-size="10" fill="#F4F7F2" opacity="0.75" text-anchor="middle" letter-spacing="3">TEA HOUSE</text>

      <!-- Center Title -->
      <text x="170" y="240" font-family="'Manrope', sans-serif" font-weight="800" font-size="19" fill="#F4F7F2" text-anchor="middle" letter-spacing="2.5">CLASSIC MASALA</text>
      
      <!-- Subtitle -->
      <text x="170" y="275" font-family="'DM Sans', sans-serif" font-weight="500" font-size="9" fill="#F4F7F2" opacity="0.85" text-anchor="middle" letter-spacing="2">TRADITIONAL INDIAN SPICES</text>

      <line x1="120" y1="315" x2="220" y2="315" stroke="#F4F7F2" stroke-width="1" opacity="0.25"/>

      <text x="170" y="385" font-family="'DM Sans', sans-serif" font-weight="500" font-size="8.5" fill="#F4F7F2" opacity="0.65" text-anchor="middle" letter-spacing="2">NET WT. 100G</text>

      <!-- Realistic subtle light reflection & depth -->
      <rect x="30" y="35" width="22" height="420" fill="black" opacity="0.08"/>
      <rect x="288" y="35" width="22" height="420" fill="black" opacity="0.1"/>
      <line x1="72" y1="35" x2="62" y2="448" stroke="#FFFFFF" stroke-width="1.2" opacity="0.25"/>
    </g>
  </g>
</svg>