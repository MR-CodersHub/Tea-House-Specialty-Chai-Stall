<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Tea House and reconnect with your favourite chai blends and rewards.">
  <link rel="icon" type="image/png" href="assets/images/logo/logo.png">
  <title>Login | Tea House &amp; Specialty Chai</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">
</head>
<body data-current-page="login">
  <main class="auth-main auth-main--login" id="mainContent">
    <section class="auth-form-panel" aria-labelledby="loginHeading">
      <div class="auth-form-topbar">
        <a class="auth-brand" href="index.html" aria-label="Tea House home">
          <img src="assets/images/logo/logo.png" alt="">
          <span class="auth-brand-copy">
            <span class="auth-brand-name">Tea House</span>
            <span class="auth-brand-tagline">SPECIALTY CHAI</span>
          </span>
        </a>
        <div class="auth-header-actions">
          <div class="auth-utility-actions">
            <button type="button" class="auth-utility-btn" id="rtlToggleBtn" aria-label="Switch to RTL layout" title="Switch to RTL layout">
              <i class="bi bi-arrow-left-right" aria-hidden="true"></i>
              <span id="rtlToggleText">RTL</span>
            </button>
            <button type="button" class="auth-utility-btn" id="themeToggleBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
              <i class="bi bi-moon-stars" aria-hidden="true"></i>
              <span id="themeToggleText">Dark</span>
            </button>
          </div>
          <a class="auth-back-link" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Home</a>
        </div>
      </div>

      <div class="auth-form-content">
        <p class="auth-eyebrow">WELCOME BACK</p>
        <h1 class="auth-heading" id="loginHeading">Your Favourite Chai Moments Await.</h1>
        <p class="auth-intro">Sign in to reconnect with your favourite blends, rewards and little moments of comfort.</p>

        <form class="auth-form" id="loginForm" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="loginEmail">Email address</label>
            <input class="auth-input" id="loginEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="loginEmailError">
            <span class="auth-error" id="loginEmailError"></span>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="loginPassword">Password</label>
            <div class="auth-input-wrap">
              <input class="auth-input" id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required aria-describedby="loginPasswordError">
              <button class="auth-password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password" aria-pressed="false">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
            <span class="auth-error" id="loginPasswordError"></span>
          </div>

          <div class="auth-form-options">
            <label class="auth-checkbox-label" for="rememberMe">
              <input id="rememberMe" name="rememberMe" type="checkbox">
              <span>Remember me</span>
            </label>
            <button class="auth-text-link" id="forgotPassword" type="button">Forgot Password?</button>
          </div>

          <p class="auth-status" id="loginStatus" role="status" aria-live="polite" hidden></p>
          <button class="auth-submit btn-forest" type="submit">Login</button>
        </form>

        <p class="auth-switch">New to our Tea House? <a href="signup.html">Create an Account.</a></p>
      </div>

      <nav class="auth-socials" aria-label="Tea House social media">
        <a class="auth-social-link" href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="bi bi-instagram" aria-hidden="true"></i></a>
        <a class="auth-social-link" href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><i class="bi bi-facebook" aria-hidden="true"></i></a>
        <a class="auth-social-link" href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><i class="bi bi-youtube" aria-hidden="true"></i></a>
        <a class="auth-social-link" href="https://pinterest.com" target="_blank" rel="noopener noreferrer" aria-label="Pinterest"><i class="bi bi-pinterest" aria-hidden="true"></i></a>
      </nav>
    </section>

    <aside class="auth-visual auth-visual--login" aria-label="A warm cup of masala chai">
      <div class="auth-visual-shape" aria-hidden="true"></div>
      <svg class="auth-botanical auth-botanical--login" viewBox="0 0 180 260" fill="none" aria-hidden="true">
        <path d="M25 242C85 188 92 116 144 25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M57 202C27 200 13 182 12 158C38 160 55 174 57 202Z" fill="currentColor" fill-opacity=".26"/>
        <path d="M78 164C109 160 124 142 127 119C101 121 84 136 78 164Z" fill="currentColor" fill-opacity=".26"/>
        <path d="M98 123C68 120 54 101 53 78C79 81 95 96 98 123Z" fill="currentColor" fill-opacity=".26"/>
        <path d="M118 83C147 77 161 59 160 36C135 41 120 57 118 83Z" fill="currentColor" fill-opacity=".26"/>
      </svg>
      <span class="auth-terracotta-dot auth-terracotta-dot--login" aria-hidden="true"></span>
      <div class="auth-photo-frame auth-photo-frame--login">
        <img src="assets/images/auth/login-hero.jpg" alt="Ceramic cup of spiced masala chai with cinnamon and star anise" fetchpriority="high">
      </div>
      <p class="auth-photo-note"><span class="auth-note-rule" aria-hidden="true"></span> A MOMENT JUST FOR YOU</p>
    </aside>
  </main>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/language.js"></script>
  <script src="assets/js/pages/login.js"></script>
</body>
</html>
